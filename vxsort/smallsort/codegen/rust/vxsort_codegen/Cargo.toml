[package]
name = "vxsort_codegen"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
gadget_synth = { path = "../gadget_synth" }
ratatui = "0.29"
serde_json = "1"
uica-core = { path = "../../uica/rust/uica-core", default-features = false }
uica-data = { path = "../../uica/rust/uica-data" }
uica-decode-ir = { path = "../../uica/rust/uica-decode-ir" }
uica-model = { path = "../../uica/rust/uica-model" }
ureq = "2"

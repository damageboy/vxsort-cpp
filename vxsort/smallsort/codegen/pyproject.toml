[project]
name = "vxsort-codegen"
version = "0.1.0"
description = "Codegen for vxsort bitonic sorters"
requires-python = ">=3.13"
dependencies = [
    "pyfunctional",
    "ipython",
    "pytest>=8.3.5",
    "pytest-cov>=7.0.0",
    "tabulate>=0.9.0",
    "rich>=14.3.1",
    "textual>=0.87.1",
    "zstandard>=0.25.0",
    "z3-solver>=4.15.8.0",
    "psutil>=5.9.0",
]

[project.scripts]
solve = "bitonic_compiler:main"
estimate = "bitonic_compiler:estimate_main"
verify = "bitonic_compiler:verify_main"
export = "bitonic_compiler:export_main"

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff>=0.14.0", "setuptools>=80.9.0", "vulture>=2.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: Z3 verification proofs (~20s each)"]
addopts = "-m 'not slow'"

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[tool.ruff]
extend-exclude = ["uica"]

[tool.vulture]
paths = ["."]
exclude = [".venv", "build", "dist", "uica"]

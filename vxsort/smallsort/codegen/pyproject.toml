[project]
name = "vxsort-codegen"
version = "0.1.0"
description = "Codegen for vxsort bitonic sorters"
requires-python = ">=3.13"
dependencies = [
    "pyfunctional",
    "ipython",
    "pytest>=8.3.5",
    "pytest-cov>=7.0.0",
    "tabulate>=0.9.0",
    "rich>=14.3.1",
]

[dependency-groups]
dev = ["ruff>=0.14.0", "setuptools>=80.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[package]
name = "bitonic_codegen"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bincode = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
crossterm = "0.29"
gadget_synth = { path = "../gadget_synth" }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
uica-core = { path = "../uica/rust/uica-core", default-features = false }
uica-data = { path = "../uica/rust/uica-data" }
uica-decode-ir = { path = "../uica/rust/uica-decode-ir" }
uica-model = { path = "../uica/rust/uica-model" }
ureq = "2"
z3.workspace = true
z3_avx = { path = "../z3_avx" }
